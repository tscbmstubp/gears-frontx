# Studio artifacts registry

[[ignore]]
reason = "Build artifacts and dependencies"
patterns = ["*/dist/*", "*/node_modules/*", "*/templates/*"]

[[ignore]]
reason = "Test files use scenario IDs, not CDSL begin/end markers"
patterns = ["*.test.*", "*.spec.*", "*/__tests__/*"]

[[ignore]]
reason = "CLI template sources are code-gen templates, not implementable source"
patterns = ["*/template-sources/*"]

[[ignore]]
reason = "Build/bundler configuration files have no CDSL backing"
patterns = ["*/tsup.config.*", "*/vite.config.*", "*/vitest.config.*", "*/postcss.config.*", "*/tailwind.config.*"]

[[ignore]]
reason = "In-package demos exercise a package's public surface rather than implementing a requirement, so no instruction exists for a marker to point at. Structural and permanent — this is not a placeholder for missing artifacts and must never be given an expiry."
patterns = ["*/demo/*"]

[[ignore]]
reason = "Documentation site infrastructure has no CDSL backing"
patterns = ["packages/docs/*"]

[[ignore]]
reason = "Auth SDK package has no backing CDSL artifact"
patterns = ["packages/auth/*"]

[[ignore]]
reason = "template-shell/template-mfe are template territory (Phase 11 template-move, split in issue #470); code carries pre-redesign markers that reference archived IDs — no active FEATURE artifact backs these packages"
patterns = ["template-shell/**", "template-mfe/**"]

[[ignore]]
reason = "UI Kit package has no backing CDSL artifact yet. Removal criterion per cpt-frontx-adr-ecosystem-layer-partition: ui-kit is registered as its own child system owning a DESIGN and at least one FEATURE, plus a PRD since it has consumers of its own, and never a DECOMPOSITION. NOT satisfied by adding a requirement to the root PRD or a component to the root DESIGN - that is the centralized shape the layer-partition decision replaced."
patterns = ["packages/ui-kit/**"]

[[ignore]]
reason = "Unmarked build/test tooling in scripts/ has no CDSL backing. NOTE: scripts/ecosystem-version-policy.mjs (ecosystem-distribution F1) and scripts/test-architecture.ts carry @cpt markers and MUST stay scanned — they are deliberately NOT ignored here."
patterns = ["scripts/test-runner/*", "scripts/manual-auth-tests/*", "scripts/check-test-dependency-versions.mjs", "scripts/run-monorepo-unit-tests.mjs", "scripts/sdk-layer-tests.ts", "scripts/verify-layered-configs.ts"]

[[systems]]
name = "FrontX Dev Kit"
slug = "frontx"
kit = "sdlc"
artifacts_dir = "architecture"

[[systems.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "architecture"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"

[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "FULL"

[systems.autodetect.artifacts.ADR]
pattern = "ADR/**/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = false

[[systems.codebase]]
path = "packages/"
extensions = [".ts", ".tsx", ".mjs"]

[[systems.codebase]]
path = "src/"
extensions = [".ts"]

[[systems.codebase]]
path = "scripts/"
extensions = [".mjs", ".ts"]

# Telemetry owns the artifacts that describe it, per the ecosystem layer-partition and
# artifact-federation decision. The autodetect form is deliberate: `required` flags do not inherit
# from the parent, and the explicit-artifact-list form validates while enforcing nothing at all —
# which would leave the member artifact chain an honour system. DECOMPOSITION and ADR are omitted
# rather than declared optional: a member never owns a DECOMPOSITION, whose purpose is organizing a
# large design into features.
[[systems.children]]
name = "Telemetry"
slug = "telemetry"
kit = "sdlc"
artifacts_dir = "packages/telemetry/architecture"

[[systems.children.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "packages/telemetry/architecture"

[systems.children.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = true

# Required only because telemetry is a published SDK with consumers and non-functional
# requirements of its own. A member without those owns no PRD.
[systems.children.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[[systems.children.codebase]]
path = "packages/telemetry/src"
extensions = [".ts"]
